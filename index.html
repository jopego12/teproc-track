<div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title">Confirmar envío</div>
    <div id="modalBody" style="font-size:14px;color:var(--muted);line-height:1.7;margin-bottom:18px"></div>
    <div class="btn-row">
      <button class="btn btn-ghost" onclick="closeModal('modalConfirm')" style="flex:1">Cancelar</button>
      <button class="btn btn-purple" onclick="confirmSend()" style="flex:2">Confirmar y enviar</button>
    </div>
  </div>
</div>

<!-- ── SUCCESS ── -->
<div class="success-overlay" id="successOverlay">
  <div class="success-icon">✅</div>
  <div class="success-title" id="successTitle">¡ENVIADO!</div>
  <div class="success-sub" id="successText"></div>
  <button class="btn btn-ghost" id="successBtn" style="margin-top:8px;width:200px" onclick="resetSuccess()">Continuar</button>
</div>

<script>
// ═══════════════════════════════════════════════════════════════
//  CONFIGURACIÓN — Reemplaza con tus URLs reales de Apps Script
// ═══════════════════════════════════════════════════════════════
const URL_REPORTES       = 'https://script.google.com/macros/s/AKfycbyoNHW8AiYYrCA4NG0chAcdEpypAUXFVbAPyjZv6AYlmUONWdjzT2nuFHecg-_aohzw/exec';
const URL_LUNA           = 'https://script.google.com/macros/s/AKfycbyK66JuuTIOjugwIQWfWNQFerRL1iNULFTWNsy_KBE_CuhCxhlNuH4ffLVaIskI4fKl/exec';  // ← tu Apps Script de recordatorios/oportunidades

// ═══════════════════════════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════════════════════════
let visits        = [];
let currentTech   = '';
let activeTimers  = {};
let recordatorios = [];   // guardados en esta sesión
let oportunidades = [];   // guardados en esta sesión
let oSeqCounter   = 1;    // contador local de secuencia

// ─── INIT ────────────────────────────────────────────────────
(function(){
  const now = new Date();
  document.getElementById('dateDisplay').textContent =
    now.toLocaleDateString('es-CO',{weekday:'short',day:'numeric',month:'short'}).toUpperCase();

  // Fecha/hora mínima para recordatorio = ahora
  const dtInput = document.getElementById('rFechaHora');
  const pad = n => String(n).padStart(2,'0');
  dtInput.min = `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}T${pad(now.getHours())}:${pad(now.getMinutes())}`;
  dtInput.value = dtInput.min;

  actualizarSecuencia();
})();

function updateTech(){ currentTech = document.getElementById('techSelect').value; }

// ─── TAB SWITCH ───────────────────────────────────────────────
function switchTab(tab){
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-'+tab).classList.add('active');
  event.currentTarget.classList.add('active');
}

// ═══════════════════════════════════════════════════════════════
//  TAB 1 — REPORTES (sin cambios de lógica)
// ═══════════════════════════════════════════════════════════════
function createVisit(){
  const cliente = document.getElementById('vCliente').value.trim();
  if(!cliente){ alert('Ingresa el nombre del cliente o lugar.'); return; }
  if(!currentTech){ alert('Selecciona el técnico primero.'); return; }
  const now = new Date();
  const visit = {
    id: Date.now(), cliente,
    minDisp: parseInt(document.getElementById('vMinDisp').value)||0,
    costoDisp: parseFloat(document.getElementById('vCostoDisp').value)||0,
    hora: now.toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit'}),
    fecha: now.toLocaleDateString('es-CO'),
    equipos: [], open: true,
  };
  visits.push(visit);
  document.getElementById('vCliente').value='';
  document.getElementById('vMinDisp').value='';
  document.getElementById('vCostoDisp').value='';
  renderVisits(); updateStats(); showSections();
  setTimeout(()=>{ const el=document.getElementById(`visit-${visit.id}`); if(el) el.scrollIntoView({behavior:'smooth',block:'start'}); toggleEquipForm(visit.id); }, 150);
}

function toggleVisit(id){ const v=visits.find(x=>x.id===id); if(v) v.open=!v.open; renderVisits(); }
function deleteVisit(id){
  if(!confirm('¿Eliminar esta visita y todos sus equipos?')) return;
  visits=visits.filter(v=>v.id!==id);
  if(activeTimers[id]){ clearInterval(activeTimers[id].interval); delete activeTimers[id]; }
  renderVisits(); updateStats(); showSections();
}
function toggleEquipForm(visitId){
  const f=document.getElementById(`equip-form-${visitId}`); if(!f) return;
  const opening=!f.classList.contains('open');
  f.classList.toggle('open',opening);
  if(opening && !activeTimers[visitId]) activeTimers[visitId]={interval:null,elapsed:0,running:false};
}
function toggleEquipTimer(visitId){
  const state=activeTimers[visitId]; if(!state) return;
  if(state.running){
    clearInterval(state.interval); state.running=false; _updateTimerUI(visitId,false); syncTimerInput(visitId);
  } else {
    state.running=true;
    const start=Date.now()-state.elapsed*1000;
    state.interval=setInterval(()=>{ state.elapsed=Math.floor((Date.now()-start)/1000); updateTimerDisplay(visitId); syncTimerInput(visitId); },1000);
    _updateTimerUI(visitId,true);
  }
}
function _updateTimerUI(visitId,running){
  const btn=document.getElementById(`tbtn-${visitId}`);
  const box=document.getElementById(`tbox-${visitId}`);
  const disp=document.getElementById(`tdisp-${visitId}`);
  if(btn) btn.textContent=running?'⏸ Pausar':'▶ Reanudar';
  if(box) box.classList.toggle('running',running);
  if(disp) disp.classList.toggle('running',running);
}
function updateTimerDisplay(visitId){
  const s=activeTimers[visitId]?.elapsed||0;
  const h=Math.floor(s/3600).toString().padStart(2,'0');
  const m=Math.floor((s%3600)/60).toString().padStart(2,'0');
  const sec=(s%60).toString().padStart(2,'0');
  const disp=document.getElementById(`tdisp-${visitId}`);
  if(disp) disp.textContent=`${h}:${m}:${sec}`;
}
function syncTimerInput(visitId){
  const mins=Math.floor((activeTimers[visitId]?.elapsed||0)/60);
  const inp=document.getElementById(`eMinServ-${visitId}`);
  if(inp) inp.value=mins;
}
function syncManualTimer(visitId){
  const inp=document.getElementById(`eMinServ-${visitId}`);
  const val=parseInt(inp?.value)||0;
  if(activeTimers[visitId]) activeTimers[visitId].elapsed=val*60;
  updateTimerDisplay(visitId);
}
function addEquipoToVisit(visitId){
  const v=visits.find(x=>x.id===visitId); if(!v) return;
  const nombre=document.getElementById(`eNombre-${visitId}`)?.value.trim();
  if(!nombre){ alert('Ingresa el número de informe.'); return; }
  const state=activeTimers[visitId];
  if(state?.running) toggleEquipTimer(visitId);
  const minServ=parseInt(document.getElementById(`eMinServ-${visitId}`)?.value)||Math.floor((state?.elapsed||0)/60);
  const costoRep=parseFloat(document.getElementById(`eCostoRep-${visitId}`)?.value)||0;
  const repuestos=document.getElementById(`eRepuestos-${visitId}`)?.value.trim()||'';
  const obs=document.getElementById(`eObs-${visitId}`)?.value.trim()||'';
  v.equipos.push({id:Date.now(),nombre,minServ,costoRep,repuestos,obs});
  if(activeTimers[visitId]){ clearInterval(activeTimers[visitId].interval); activeTimers[visitId]={interval:null,elapsed:0,running:false}; }
  renderVisits(); updateStats();
  const formEl=document.getElementById(`equip-form-${visitId}`);
  if(formEl){
    formEl.classList.add('open');
    ['eNombre','eMinServ','eCostoRep','eRepuestos','eObs'].forEach(p=>{ const el=document.getElementById(`${p}-${visitId}`); if(el) el.value=''; });
    const tdisp=document.getElementById(`tdisp-${visitId}`); if(tdisp){ tdisp.textContent='00:00:00'; tdisp.classList.remove('running'); }
    const tbox=document.getElementById(`tbox-${visitId}`); if(tbox) tbox.classList.remove('running');
    const tbtn=document.getElementById(`tbtn-${visitId}`); if(tbtn) tbtn.textContent='▶ Iniciar';
  }
}
function deleteEquipo(visitId,equipId){
  if(!confirm('¿Eliminar este equipo?')) return;
  const v=visits.find(x=>x.id===visitId);
  if(v) v.equipos=v.equipos.filter(e=>e.id!==equipId);
  renderVisits(); updateStats();
}
function renderVisits(){
  const list=document.getElementById('visitList');
  document.getElementById('visitCount').textContent=visits.length;
  if(visits.length===0){ list.innerHTML=`<div class="empty-state"><div class="empty-icon">📍</div><div class="empty-text">Crea tu primera visita arriba.</div></div>`; return; }
  list.innerHTML=visits.map((v,vi)=>{
    const totalMinServ=v.equipos.reduce((a,e)=>a+e.minServ,0);
    const totalCostoRep=v.equipos.reduce((a,e)=>a+e.costoRep,0);
    const totalCosto=totalCostoRep+v.costoDisp;
    const state=activeTimers[v.id]||{elapsed:0,running:false};
    const s=state.elapsed;
    const th=Math.floor(s/3600).toString().padStart(2,'0');
    const tm=Math.floor((s%3600)/60).toString().padStart(2,'0');
    const tsec=(s%60).toString().padStart(2,'0');
    const isFormOpen=!!document.getElementById(`equip-form-${v.id}`)?.classList.contains('open');
    return `
    <div class="visit-card ${v.open?'active-visit':''}" id="visit-${v.id}">
      <div class="visit-header" onclick="toggleVisit(${v.id})">
        <div class="visit-header-left">
          <div class="status-dot ${v.open?'dot-active':'dot-closed'}"></div>
          <div style="min-width:0">
            <div class="visit-name">${v.cliente}</div>
            <div class="visit-sub">${v.hora} · ${v.equipos.length} equipo${v.equipos.length!==1?'s':''}</div>
          </div>
        </div>
        <span class="tag tag-purple">${v.equipos.length} eq.</span>
        <span class="visit-arrow ${v.open?'open':''}">▼</span>
      </div>
      <div class="visit-summary">
        <div class="vchip">⚙ <b>${totalMinServ}m</b></div>
        <div class="vchip">🚗 <b>${v.minDisp}m</b></div>
        <div class="vchip">💰 <b>$${totalCosto.toLocaleString()}</b></div>
        <div style="margin-left:auto">
          <button class="btn btn-danger" style="padding:4px 10px;font-size:11px;width:auto" onclick="event.stopPropagation();deleteVisit(${v.id})">🗑 Eliminar</button>
        </div>
      </div>
      ${v.open?`
      <div class="visit-body">
        ${v.equipos.length>0?`
        <div class="equip-mini">
          ${v.equipos.map((e,ei)=>`
          <div class="equip-mini-item">
            <div class="emi-header">
              <div style="display:flex;align-items:center;min-width:0">
                <div class="emi-num">#${ei+1}</div>
                <div class="emi-name">${e.nombre}</div>
              </div>
              <button class="del-btn" onclick="deleteEquipo(${v.id},${e.id})">✕</button>
            </div>
            <div class="emi-grid">
              <div class="emi-cell"><div class="emi-label">Servicio</div><div class="emi-val time">${e.minServ}m</div></div>
              <div class="emi-cell"><div class="emi-label">Repuestos</div><div class="emi-val money">$${e.costoRep.toLocaleString()}</div></div>
              <div class="emi-cell" style="grid-column:span 2"><div class="emi-label">Materiales</div><div class="emi-val" style="font-size:11px;color:var(--muted);font-family:var(--sans);text-align:left">${e.repuestos||'—'}</div></div>
            </div>
            ${e.obs?`<div class="emi-note">📝 ${e.obs}</div>`:''}
          </div>`).join('')}
        </div>`:`<div style="text-align:center;color:var(--muted);font-size:12px;padding:6px 0 12px">Sin equipos aún — agrega el primero ↓</div>`}
        <div class="add-equip-form ${isFormOpen?'open':''}" id="equip-form-${v.id}">
          <div style="font-family:var(--mono);font-size:10px;color:rgba(0,212,255,0.7);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:10px">+ Equipo #${v.equipos.length+1}</div>
          <div class="form-row"><label class="form-label">Número de informe</label><input type="text" id="eNombre-${v.id}" placeholder="Ej: 1234"></div>
          <div style="margin-bottom:10px">
            <label class="form-label">Cronómetro de servicio</label>
            <div class="mini-timer-row">
              <div class="mini-timer" id="tbox-${v.id}">
                <div class="mini-timer-val" id="tdisp-${v.id}">${th}:${tm}:${tsec}</div>
                <div class="mini-timer-lbl">⚙ tiempo servicio</div>
              </div>
              <button class="btn btn-green" id="tbtn-${v.id}" onclick="toggleEquipTimer(${v.id})" style="font-size:12px">${state.running?'⏸ Pausar':'▶ Iniciar'}</button>
            </div>
          </div>
          <div class="row2" style="margin-bottom:10px">
            <div><label class="form-label">Tiempo servicio (min)</label><input type="number" id="eMinServ-${v.id}" placeholder="0" min="0" oninput="syncManualTimer(${v.id})"></div>
            <div><label class="form-label">Costo repuestos $</label><input type="number" id="eCostoRep-${v.id}" placeholder="0" min="0"></div>
          </div>
          <div class="form-row"><label class="form-label">Repuestos / materiales</label><input type="text" id="eRepuestos-${v.id}" placeholder="control digital, cableado etc."></div>
          <div class="form-row"><label class="form-label">Observaciones</label><textarea id="eObs-${v.id}" placeholder="Estado, pendientes, notas..."></textarea></div>
          <div class="btn-row">
            <button class="btn btn-ghost" onclick="toggleEquipForm(${v.id})" style="flex:1">Cancelar</button>
            <button class="btn btn-primary" onclick="addEquipoToVisit(${v.id})" style="flex:2">✔ Guardar equipo</button>
          </div>
        </div>
        <button class="btn btn-green" onclick="toggleEquipForm(${v.id})">+ Agregar equipo a esta visita</button>
      </div>`:''}</div>`;
  }).reverse().join('');
}
function updateStats(){
  let totalEquipos=0,totalMins=0,totalCosto=0;
  visits.forEach(v=>{ totalEquipos+=v.equipos.length; totalMins+=v.minDisp+v.equipos.reduce((a,e)=>a+e.minServ,0); totalCosto+=v.costoDisp+v.equipos.reduce((a,e)=>a+e.costoRep,0); });
  document.getElementById('statVisitas').textContent=visits.length;
  document.getElementById('statEquipos').textContent=totalEquipos;
  const h=Math.floor(totalMins/60),m=totalMins%60;
  document.getElementById('statTiempo').textContent=`${h}h ${m}m`;
  document.getElementById('statCosto').textContent=`$${totalCosto.toLocaleString()}`;
}
function showSections(){
  const show=visits.length>0;
  document.getElementById('visitSection').style.display=show?'block':'none';
  document.getElementById('sendSection').style.display=show?'block':'none';
}
function sendReport(){
  if(!currentTech){ alert('Selecciona tu nombre primero.'); return; }
  if(visits.length===0){ alert('Agrega al menos una visita.'); return; }
  const totalEquipos=visits.reduce((a,v)=>a+v.equipos.length,0);
  const totalMins=visits.reduce((a,v)=>a+v.minDisp+v.equipos.reduce((b,e)=>b+e.minServ,0),0);
  const totalCosto=visits.reduce((a,v)=>a+v.costoDisp+v.equipos.reduce((b,e)=>b+e.costoRep,0),0);
  const h=Math.floor(totalMins/60),m=totalMins%60;
  document.getElementById('modalBody').innerHTML=`
    <strong style="color:var(--text);font-size:15px">${currentTech}</strong><br><br>
    📍 <strong>${visits.length} visita${visits.length!==1?'s':''}</strong> con <strong>${totalEquipos} equipo${totalEquipos!==1?'s':''}</strong><br>
    ⏱ Tiempo total: <strong style="color:var(--orange)">${h}h ${m}m</strong><br>
    💰 Costo total: <strong style="color:var(--green)">$${totalCosto.toLocaleString()}</strong><br><br>
    ¿Confirmas el envío a Google Sheets?`;
  document.getElementById('modalConfirm').classList.add('open');
}
function closeModal(id){ document.getElementById(id||'modalConfirm').classList.remove('open'); }
async function confirmSend(){
  closeModal('modalConfirm');
  const payload=[];
  visits.forEach(v=>{
    const base={tecnico:currentTech,fecha:v.fecha,hora:v.hora,cliente:v.cliente,visita_min_desplaz:v.minDisp,visita_costo_desplaz:v.costoDisp};
    if(v.equipos.length===0) payload.push({...base,equipo:'(sin equipo)',min_servicio:0,costo_repuestos:0,repuestos:'',observaciones:''});
    else v.equipos.forEach(e=>payload.push({...base,equipo:e.nombre,min_servicio:e.minServ,costo_repuestos:e.costoRep,repuestos:e.repuestos,observaciones:e.obs}));
  });
  try{
    await fetch(URL_REPORTES,{method:'POST',body:JSON.stringify(payload),headers:{'Content-Type':'application/json'},mode:'no-cors'});
    showSuccess('¡ENVIADO!',`${payload.length} registro${payload.length!==1?'s':''} enviados a Google Sheets.`,'resetAll');
  } catch(err){ alert('Error de conexión. Verifica tu internet.'); }
}

// ═══════════════════════════════════════════════════════════════
//  TAB 2 — RECORDATORIOS
// ═══════════════════════════════════════════════════════════════
async function enviarRecordatorio(){
  const pendiente  = document.getElementById('rPendiente').value.trim();
  const fechaHora  = document.getElementById('rFechaHora').value;
  const prioridad  = document.getElementById('rPrioridad').value;
  const categoria  = document.getElementById('rCategoria').value;
  const chatId     = document.getElementById('rChatId').value.trim();
  const asignadoPor= document.getElementById('rAsignadoPor').value.trim() || chatId;

  if(!pendiente){ alert('Escribe la descripción del recordatorio.'); return; }
  if(!fechaHora){ alert('Selecciona la fecha y hora.'); return; }
  if(!chatId){
    document.getElementById('rChatWarn').style.display='block';
    document.getElementById('rChatId').focus();
    return;
  }
  document.getElementById('rChatWarn').style.display='none';

  if(URL_LUNA.includes('PON_AQUI')){
    // Modo demo local
    const rec = { pendiente, fechaHora, prioridad, categoria, chatId, asignadoPor, timestamp: new Date() };
    recordatorios.push(rec);
    renderRecordatorios();
    limpiarFormRecordatorio();
    showSuccess('🔔 RECORDATORIO','Guardado en modo demo.\nConfigura URL_LUNA en el código para activar Telegram.','continuar');
    return;
  }

  const btn = event.currentTarget;
  btn.innerHTML = '<span class="spinner"></span> Enviando...';
  btn.disabled = true;

  try{
    const res = await fetch(URL_LUNA,{
      method:'POST',
      body: JSON.stringify({ accion:'recordatorio', pendiente, fechaHora, prioridad, categoria, chatId, asignadoPor }),
      headers:{'Content-Type':'application/json'},
      mode:'no-cors'
    });
    const rec = { pendiente, fechaHora, prioridad, categoria, chatId, asignadoPor, timestamp: new Date() };
    recordatorios.push(rec);
    renderRecordatorios();
    limpiarFormRecordatorio();
    showSuccess('🔔 ENVIADO','Recordatorio guardado en Sheets y notificación enviada a Telegram.','continuar');
  } catch(err){
    alert('Error al conectar. Verifica la URL del script y tu conexión.');
  } finally {
    btn.innerHTML = '🔔 Guardar y notificar por Telegram';
    btn.disabled = false;
  }
}

function limpiarFormRecordatorio(){
  document.getElementById('rPendiente').value='';
  document.getElementById('rPrioridad').value='Normal';
  document.getElementById('rCategoria').value='';
}

function renderRecordatorios(){
  const total  = recordatorios.length;
  const pend   = recordatorios.filter(r=>r.prioridad!=='Urgente').length;
  const urg    = recordatorios.filter(r=>r.prioridad==='Urgente').length;
  const ultima = recordatorios.length>0 ? (recordatorios[recordatorios.length-1].categoria||'—') : '—';

  document.getElementById('rStatTotal').textContent = total;
  document.getElementById('rStatPend').textContent  = total - urg;
  document.getElementById('rStatOk').textContent    = urg;
  document.getElementById('rStatCat').textContent   = ultima.substring(0,3).toUpperCase();
  document.getElementById('rCount').textContent     = total;

  const sec  = document.getElementById('rListSection');
  const list = document.getElementById('rList');
  if(total===0){ sec.style.display='none'; return; }
  sec.style.display='block';

  list.innerHTML = [...recordatorios].reverse().map((r,i)=>{
    const priClass = r.prioridad==='Urgente'?'urg':r.prioridad==='Alta'?'alta':'ok';
    const priEmoji = r.prioridad==='Urgente'?'🚨':r.prioridad==='Alta'?'⚡':'✅';
    const dt = new Date(r.fechaHora);
    const dtStr = dt.toLocaleDateString('es-CO',{day:'2-digit',month:'short'}) + ' ' + dt.toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit'});
    return `
    <div class="item-card">
      <div class="item-card-top">
        <div class="item-title">${r.pendiente}</div>
        <span class="tag tag-orange" style="font-size:10px">#${recordatorios.length-i}</span>
      </div>
      <div class="item-meta">
        <span class="item-chip ${priClass}">${priEmoji} ${r.prioridad}</span>
        <span class="item-chip">🕒 ${dtStr}</span>
        ${r.categoria?`<span class="item-chip">📂 ${r.categoria}</span>`:''}
        <span class="item-chip">💬 ${r.chatId}</span>
      </div>
    </div>`;
  }).join('');
}

// ═══════════════════════════════════════════════════════════════
//  TAB 3 — OPORTUNIDADES
// ═══════════════════════════════════════════════════════════════
function actualizarSecuencia(){
  const next = 'OP-' + String(oSeqCounter).padStart(3,'0');
  document.getElementById('oSecuencia').value = next;
}

async function enviarOportunidad(){
  const tipo        = document.getElementById('oTipo').value;
  const cliente     = document.getElementById('oCliente').value.trim();
  const descripcion = document.getElementById('oDescripcion').value.trim();
  const valor       = parseFloat(document.getElementById('oValor').value)||0;
  const fechaCierre = document.getElementById('oFechaCierre').value;
  const obs         = document.getElementById('oObs').value.trim();
  const chatId      = document.getElementById('oChatId').value.trim();
  const codigo      = document.getElementById('oSecuencia').value;

  if(!tipo){ alert('Selecciona el tipo de oportunidad.'); return; }
  if(!cliente){ alert('Ingresa el nombre del cliente.'); return; }
  if(!descripcion){ alert('Describe la oportunidad.'); return; }

  const opp = { codigo, tipo, cliente, descripcion, valor, fechaCierre, obs, chatId, timestamp: new Date() };

  if(URL_LUNA.includes('PON_AQUI')){
    oportunidades.push(opp);
    oSeqCounter++;
    actualizarSecuencia();
    renderOportunidades();
    limpiarFormOportunidad();
    showSuccess('📈 OPORTUNIDAD',`${codigo} guardada en modo demo.\nConfigura URL_LUNA para activar Telegram.`,'continuar');
    return;
  }

  const btn = event.currentTarget;
  btn.innerHTML = '<span class="spinner"></span> Registrando...';
  btn.disabled = true;

  try{
    await fetch(URL_LUNA,{
      method:'POST',
      body: JSON.stringify({ accion:'oportunidad', tipo, cliente, descripcion, valorEstimado:valor, fechaCierre, observaciones:obs, chatId }),
      headers:{'Content-Type':'application/json'},
      mode:'no-cors'
    });
    oportunidades.push(opp);
    oSeqCounter++;
    actualizarSecuencia();
    renderOportunidades();
    limpiarFormOportunidad();
    showSuccess('📈 REGISTRADA',`Oportunidad ${codigo} guardada en Sheets y notificada por Telegram.`,'continuar');
  } catch(err){
    alert('Error al conectar. Verifica la URL del script y tu conexión.');
  } finally {
    btn.innerHTML = '📈 Registrar oportunidad';
    btn.disabled = false;
  }
}

function limpiarFormOportunidad(){
  document.getElementById('oTipo').value='';
  document.getElementById('oCliente').value='';
  document.getElementById('oDescripcion').value='';
  document.getElementById('oValor').value='';
  document.getElementById('oFechaCierre').value='';
  document.getElementById('oObs').value='';
}

function renderOportunidades(){
  const total = oportunidades.length;
  const valor = oportunidades.reduce((a,o)=>a+o.valor,0);
  const last  = oportunidades.length>0 ? oportunidades[oportunidades.length-1].codigo : '—';

  document.getElementById('oStatTotal').textContent  = total;
  document.getElementById('oStatValor').textContent  = valor>0?`$${(valor/1000).toFixed(0)}K`:'$0';
  document.getElementById('oStatSesion').textContent = total;
  document.getElementById('oStatSeq').textContent    = last;
  document.getElementById('oCount').textContent      = total;

  const sec  = document.getElementById('oListSection');
  const list = document.getElementById('oList');
  if(total===0){ sec.style.display='none'; return; }
  sec.style.display='block';

  list.innerHTML = [...oportunidades].reverse().map(o=>{
    const dt = new Date(o.timestamp);
    const hora = dt.toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit'});
    return `
    <div class="item-card">
      <div class="item-card-top">
        <div>
          <div class="item-title">${o.descripcion}</div>
          <div style="font-size:12px;color:var(--muted);margin-top:2px">👤 ${o.cliente}</div>
        </div>
        <span class="seq-badge">${o.codigo}</span>
      </div>
      <div class="item-meta">
        <span class="item-chip">${o.tipo}</span>
        ${o.valor>0?`<span class="item-chip ok">💰 $${o.valor.toLocaleString()}</span>`:''}
        ${o.fechaCierre?`<span class="item-chip">📅 ${o.fechaCierre}</span>`:''}
        <span class="item-chip">🕒 ${hora}</span>
        ${o.chatId?`<span class="item-chip">💬 ${o.chatId}</span>`:''}
      </div>
      ${o.obs?`<div style="font-size:11px;color:var(--muted);margin-top:6px;font-style:italic">📝 ${o.obs}</div>`:''}
    </div>`;
  }).join('');
}

// ═══════════════════════════════════════════════════════════════
//  SUCCESS OVERLAY
// ═══════════════════════════════════════════════════════════════
let _successAction = 'continuar';
function showSuccess(titulo, texto, accion){
  _successAction = accion || 'continuar';
  document.getElementById('successTitle').textContent = titulo;
  document.getElementById('successText').textContent  = texto;
  document.getElementById('successBtn').textContent   = accion==='resetAll'?'Nueva jornada':'Continuar';
  document.getElementById('successOverlay').classList.add('show');
}
function resetSuccess(){
  document.getElementById('successOverlay').classList.remove('show');
  if(_successAction==='resetAll') resetAll();
}
function resetAll(){
  Object.values(activeTimers).forEach(s=>{ if(s.interval) clearInterval(s.interval); });
  activeTimers={}; visits=[]; currentTech='';
  document.getElementById('techSelect').value='';
  renderVisits(); updateStats(); showSections();
}

document.getElementById('modalConfirm').addEventListener('click',function(e){ if(e.target===this) closeModal('modalConfirm'); });
